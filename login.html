<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · FreshMart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <a href="index.html" class="auth-logo">
      <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
      <h1>FreshMart</h1>
    </a>

    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Log in to your account to continue shopping.</p>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div class="form-error" id="loginError"></div>

        <button type="submit" class="btn-primary-full" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Log In
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html" id="registerLink">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const requestedReturnUrl = new URLSearchParams(window.location.search).get('returnUrl');
    if (requestedReturnUrl === 'checkout.html') document.getElementById('registerLink').href = 'register.html?returnUrl=checkout.html';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

      try {
        await Auth.login({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        });
        const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
        window.location.href = returnUrl === 'admin.html' && Auth.isAdmin()
          ? returnUrl
          : returnUrl === 'checkout.html' ? returnUrl : 'account.html';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
      }
    });
  </script>
</body>
</html>
