<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel · FreshMart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="admin-header">
    <div class="logo-area">
      <a href="index.html"><div class="logo-icon"><i class="fas fa-shopping-basket"></i></div></a>
      <div class="logo-text"><h1>FreshMart</h1><span>ADMIN PANEL</span></div>
    </div>
    <div class="admin-header-actions">
      <a href="index.html" class="admin-link"><i class="fas fa-store"></i> Storefront</a>
      <button class="admin-link" id="adminLogout"><i class="fas fa-sign-out-alt"></i> Log out</button>
    </div>
  </header>

  <main class="container admin-page">
    <div class="admin-intro">
      <div>
        <p class="admin-eyebrow">CONTROL CENTER</p>
        <h1>Manage FreshMart</h1>
        <p>Add, update, and remove the catalog records used by the storefront.</p>
      </div>
      <div class="admin-stats" id="adminStats"></div>
    </div>

    <div class="admin-tabs" role="tablist" aria-label="Administration sections">
      <button class="admin-tab active" data-section="products" role="tab"><i class="fas fa-box"></i> Products</button>
      <button class="admin-tab" data-section="categories" role="tab"><i class="fas fa-tags"></i> Categories</button>
      <button class="admin-tab" data-section="users" role="tab"><i class="fas fa-users"></i> Users</button>
    </div>

    <div id="adminNotice" class="admin-notice" role="status"></div>
    <section id="adminSection" class="admin-section"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
