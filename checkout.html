<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · FreshMart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="top-bar">
    <div>🔒 Secure Checkout</div>
    <div class="top-links"><a href="#">Help</a></div>
  </div>

  <header class="main-header">
    <div class="logo-area">
      <a href="index.html"><div class="logo-icon"><i class="fas fa-shopping-basket"></i></div></a>
      <div class="logo-text"><h1>FreshMart</h1><span>ONLINE SUPERMARKET</span></div>
    </div>
    <div class="header-actions" style="margin-left:auto;">
      <a href="login.html" class="icon-btn" data-auth-link aria-label="Account"><i class="fas fa-user"></i></a>
      <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="cart-badge" id="headerCartCount">0</span></a>
    </div>
  </header>

  <div class="container page-content">
    <h1 class="page-title">Checkout</h1>

    <div class="checkout-layout">
      <div class="checkout-main">
        <form id="checkoutForm">
          <!-- Contact -->
          <div class="checkout-step">
            <h2><span class="step-num">1</span> Contact Information</h2>
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="coName" required>
              </div>
              <div class="form-group">
                <label>Email *</label>
                <input type="email" id="coEmail" required>
              </div>
              <div class="form-group">
                <label>Phone *</label>
                <input type="tel" id="coPhone" required>
              </div>
            </div>
          </div>

          <!-- Delivery -->
          <div class="checkout-step">
            <h2><span class="step-num">2</span> Delivery Address</h2>
            <div class="form-grid">
              <div class="form-group full">
                <label>Street Address *</label>
                <input type="text" id="coAddress" required>
              </div>
              <div class="form-group">
                <label>City *</label>
                <input type="text" id="coCity" required>
              </div>
              <div class="form-group">
                <label>Postal Code *</label>
                <input type="text" id="coPostal" required>
              </div>
            </div>
          </div>

          <!-- Payment -->
          <div class="checkout-step">
            <h2><span class="step-num">3</span> Payment Method</h2>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment" value="card" checked>
                <i class="fas fa-credit-card"></i> Credit / Debit Card
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="cash">
                <i class="fas fa-money-bill-wave"></i> Cash on Delivery
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="wallet">
                <i class="fas fa-wallet"></i> Digital Wallet
              </label>
            </div>
          </div>

          <div class="form-error" id="checkoutError"></div>
        </form>
      </div>

      <aside class="checkout-sidebar">
        <div class="order-summary">
          <h3>Order Summary</h3>
          <div id="checkoutItems" class="checkout-items"></div>
          <div class="summary-row"><span>Subtotal</span><span id="coSubtotal">LKR 0</span></div>
          <div class="summary-row"><span>Delivery</span><span id="coDelivery">LKR 0</span></div>
          <div class="summary-row total-row"><span>Total</span><span id="coTotal">LKR 0</span></div>
          <button class="btn-checkout" id="placeOrderBtn">
            <i class="fas fa-lock"></i> Place Order
          </button>
          <p class="secure-note"><i class="fas fa-shield-alt"></i> Your information is secure</p>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
